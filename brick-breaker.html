<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Brick Breaker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      touch-action: none;
    }

    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 480px;
      padding: 8px 12px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    #hud span { color: #f0c040; }

    #gameCanvas {
      display: block;
      border: 2px solid #3a3a6a;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(100, 100, 255, 0.4);
      background: #0d0d2b;
      touch-action: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,10,0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 10;
      text-align: center;
      padding: 24px;
    }

    #overlay h1 {
      font-size: clamp(28px, 8vw, 48px);
      margin-bottom: 12px;
      background: linear-gradient(135deg, #f0c040, #ff6060, #40c0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #overlay p {
      font-size: clamp(14px, 4vw, 18px);
      color: #aaa;
      margin-bottom: 28px;
      max-width: 320px;
      line-height: 1.5;
    }

    #overlay .score-display {
      font-size: clamp(20px, 6vw, 32px);
      color: #f0c040;
      margin-bottom: 24px;
    }

    #startBtn {
      background: linear-gradient(135deg, #5050ff, #a040ff);
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(100, 60, 255, 0.5);
      transition: transform 0.1s, box-shadow 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    #startBtn:active { transform: scale(0.96); box-shadow: 0 2px 10px rgba(100, 60, 255, 0.4); }

    #hint {
      margin-top: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>

<div id="overlay">
  <h1>🧱 Brick Breaker</h1>
  <p id="overlayMsg">Rompe todos los ladrillos sin dejar caer la pelota</p>
  <div class="score-display" id="overlayScore" style="display:none"></div>
  <button id="startBtn">JUGAR</button>
  <p id="hint">Desliza para mover la paleta</p>
</div>

<div id="hud">
  <div>Puntos: <span id="scoreDisplay">0</span></div>
  <div>Nivel: <span id="levelDisplay">1</span></div>
  <div>Vidas: <span id="livesDisplay">❤️❤️❤️</span></div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const overlayMsg = document.getElementById('overlayMsg');
  const overlayScore = document.getElementById('overlayScore');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const levelDisplay = document.getElementById('levelDisplay');
  const livesDisplay = document.getElementById('livesDisplay');

  // ─── Responsive sizing ──────────────────────────────────────────────────────
  function resize() {
    const maxW = Math.min(window.innerWidth - 4, 480);
    const maxH = Math.min(window.innerHeight - 80, 780);
    canvas.width  = maxW;
    canvas.height = maxH;
    initGame();
  }

  // ─── Game state ─────────────────────────────────────────────────────────────
  let score, lives, level, gameRunning, animId;
  let paddle, ball, bricks;

  const BRICK_ROWS    = 6;
  const BRICK_COLS    = 7;
  const BRICK_PADDING = 5;
  const BRICK_TOP     = 60;

  const BRICK_COLORS = [
    ['#ff4d6d','#c9184a'],  // row 0 – red
    ['#ff9500','#cc7600'],  // row 1 – orange
    ['#ffdd00','#ccaa00'],  // row 2 – yellow
    ['#4ade80','#16a34a'],  // row 3 – green
    ['#38bdf8','#0284c7'],  // row 4 – blue
    ['#c084fc','#7c3aed'],  // row 5 – purple
  ];

  function initGame() {
    const W = canvas.width, H = canvas.height;

    paddle = {
      w: Math.min(W * 0.25, 100),
      h: 12,
      x: W / 2 - 50,
      y: H - 40,
      speed: 8,
    };

    const baseSpeed = 4 + (level - 1) * 0.6;
    const angle = -Math.PI / 4 + (Math.random() - 0.5) * 0.4;

    ball = {
      x: W / 2,
      y: H - 60,
      r: Math.max(7, W * 0.016),
      dx: baseSpeed * Math.cos(angle),
      dy: -Math.abs(baseSpeed * Math.sin(angle)) - baseSpeed * 0.7,
    };

    // Ensure minimum vertical speed
    if (Math.abs(ball.dy) < 2.5) ball.dy = -2.5;

    buildBricks();
  }

  function buildBricks() {
    const W = canvas.width;
    const brickW = (W - BRICK_PADDING * (BRICK_COLS + 1)) / BRICK_COLS;
    const brickH = Math.max(22, canvas.height * 0.04);

    bricks = [];
    for (let r = 0; r < BRICK_ROWS; r++) {
      for (let c = 0; c < BRICK_COLS; c++) {
        const hits = r < 2 ? 2 : 1; // top two rows need 2 hits
        bricks.push({
          x: BRICK_PADDING + c * (brickW + BRICK_PADDING),
          y: BRICK_TOP + r * (brickH + BRICK_PADDING),
          w: brickW,
          h: brickH,
          hits,
          maxHits: hits,
          color: BRICK_COLORS[r % BRICK_COLORS.length],
          alive: true,
        });
      }
    }
  }

  function startGame() {
    score = 0; lives = 3; level = 1;
    overlay.style.display = 'none';
    gameRunning = true;
    updateHUD();
    cancelAnimationFrame(animId);
    resize();
    loop();
  }

  function updateHUD() {
    scoreDisplay.textContent = score;
    levelDisplay.textContent = level;
    livesDisplay.textContent = '❤️'.repeat(lives);
  }

  // ─── Input ──────────────────────────────────────────────────────────────────
  let touchX = null;
  let lastTouchX = null;

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    touchX = e.touches[0].clientX;
    lastTouchX = touchX;
  }, { passive: false });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const tx = e.touches[0].clientX;
    const delta = tx - lastTouchX;
    lastTouchX = tx;
    paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x + delta));
  }, { passive: false });

  canvas.addEventListener('touchend', e => {
    e.preventDefault();
    touchX = null;
    lastTouchX = null;
  }, { passive: false });

  // Mouse support (desktop)
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, mx - paddle.w / 2));
  });

  // ─── Collision helpers ───────────────────────────────────────────────────────
  function circleRect(bx, by, br, rx, ry, rw, rh) {
    const nearX = Math.max(rx, Math.min(bx, rx + rw));
    const nearY = Math.max(ry, Math.min(by, ry + rh));
    const dx = bx - nearX, dy = by - nearY;
    return dx * dx + dy * dy <= br * br;
  }

  function reflectBall(brick) {
    const overlapLeft  = (ball.x + ball.r) - brick.x;
    const overlapRight = (brick.x + brick.w) - (ball.x - ball.r);
    const overlapTop   = (ball.y + ball.r) - brick.y;
    const overlapBot   = (brick.y + brick.h) - (ball.y - ball.r);

    const minH = Math.min(overlapLeft, overlapRight);
    const minV = Math.min(overlapTop, overlapBot);

    if (minH < minV) {
      ball.dx = -ball.dx;
    } else {
      ball.dy = -ball.dy;
    }
  }

  // ─── Main loop ───────────────────────────────────────────────────────────────
  function loop() {
    if (!gameRunning) return;
    update();
    draw();
    animId = requestAnimationFrame(loop);
  }

  function update() {
    const W = canvas.width, H = canvas.height;

    ball.x += ball.dx;
    ball.y += ball.dy;

    // Wall bounces
    if (ball.x - ball.r < 0)      { ball.x = ball.r;      ball.dx = Math.abs(ball.dx); }
    if (ball.x + ball.r > W)      { ball.x = W - ball.r;  ball.dx = -Math.abs(ball.dx); }
    if (ball.y - ball.r < 0)      { ball.y = ball.r;      ball.dy = Math.abs(ball.dy); }

    // Paddle collision
    if (
      ball.dy > 0 &&
      ball.y + ball.r >= paddle.y &&
      ball.y + ball.r <= paddle.y + paddle.h + Math.abs(ball.dy) &&
      ball.x >= paddle.x &&
      ball.x <= paddle.x + paddle.w
    ) {
      const hit = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
      const angle = hit * (Math.PI / 3);
      const speed = Math.hypot(ball.dx, ball.dy);
      ball.dx = speed * Math.sin(angle);
      ball.dy = -Math.abs(speed * Math.cos(angle));
      ball.y = paddle.y - ball.r;
    }

    // Ball lost
    if (ball.y - ball.r > H) {
      lives--;
      updateHUD();
      if (lives <= 0) {
        gameOver();
        return;
      }
      resetBall();
    }

    // Brick collisions
    let remaining = 0;
    for (const brick of bricks) {
      if (!brick.alive) continue;
      remaining++;
      if (circleRect(ball.x, ball.y, ball.r, brick.x, brick.y, brick.w, brick.h)) {
        reflectBall(brick);
        brick.hits--;
        if (brick.hits <= 0) {
          brick.alive = false;
          score += brick.maxHits === 2 ? 20 : 10;
        } else {
          score += 5;
        }
        updateHUD();
        break; // one collision per frame
      }
    }

    if (remaining === 0) {
      level++;
      initGame();
      updateHUD();
    }
  }

  function resetBall() {
    const W = canvas.width, H = canvas.height;
    const baseSpeed = 4 + (level - 1) * 0.6;
    ball.x = W / 2;
    ball.y = H - 60;
    ball.dx = (Math.random() > 0.5 ? 1 : -1) * baseSpeed * 0.7;
    ball.dy = -baseSpeed;
  }

  function gameOver() {
    gameRunning = false;
    cancelAnimationFrame(animId);
    overlayMsg.textContent = lives <= 0 ? '¡Game Over!' : '¡Felicitaciones!';
    overlayScore.style.display = 'block';
    overlayScore.textContent = `Puntuación: ${score}`;
    startBtn.textContent = 'JUGAR DE NUEVO';
    overlay.style.display = 'flex';
  }

  // ─── Drawing ────────────────────────────────────────────────────────────────
  function draw() {
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    // Background grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y < H; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

    // Bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      const [light, dark] = b.color;
      const alpha = b.hits < b.maxHits ? 0.55 : 1;

      ctx.globalAlpha = alpha;
      const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
      grad.addColorStop(0, light);
      grad.addColorStop(1, dark);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 4);
      ctx.fill();

      // Shine
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      ctx.beginPath();
      ctx.roundRect(b.x + 3, b.y + 2, b.w - 6, b.h * 0.4, 3);
      ctx.fill();

      // Crack indicator for 2-hit bricks on first hit
      if (b.maxHits === 2 && b.hits === 1) {
        ctx.strokeStyle = 'rgba(255,255,255,0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(b.x + b.w * 0.3, b.y + 2);
        ctx.lineTo(b.x + b.w * 0.5, b.y + b.h * 0.5);
        ctx.lineTo(b.x + b.w * 0.7, b.y + b.h - 2);
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
    }

    // Paddle
    const pg = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
    pg.addColorStop(0, '#a0a0ff');
    pg.addColorStop(1, '#5050cc');
    ctx.fillStyle = pg;
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.roundRect(paddle.x + 4, paddle.y + 2, paddle.w - 8, paddle.h * 0.4, 3);
    ctx.fill();

    // Ball
    const bg = ctx.createRadialGradient(ball.x - ball.r * 0.3, ball.y - ball.r * 0.3, 1, ball.x, ball.y, ball.r);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(0.4, '#c0c0ff');
    bg.addColorStop(1, '#6060ff');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();

    // Ball glow
    ctx.shadowColor = '#8080ff';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // ─── Init ────────────────────────────────────────────────────────────────────
  startBtn.addEventListener('click', startGame);
  window.addEventListener('resize', () => { if (gameRunning) resize(); });
  resize();
</script>
</body>
</html>
